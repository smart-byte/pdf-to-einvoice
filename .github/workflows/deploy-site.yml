name: Deploy site

# Builds site/ and publishes it with GitHub Pages at https://smart-byte.github.io/pdf-to-einvoice/.
# Pages must be switched on once, with "GitHub Actions" as its source (see docs/publishing.md).
on:
  push:
    branches: [main]
    # The page runs the code in src/, so library changes redeploy it too.
    paths: [site/**, src/**, examples/**, package.json, package-lock.json, .github/workflows/deploy-site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'smart-byte/pdf-to-einvoice' # forks have no Pages site to deploy to
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v5
