name: Deploy site

# Builds site/ and publishes it to Cloudflare as the Worker in site/wrangler.jsonc, served at https://pdf-to-einvoice.app.
# Started by hand only (Actions → Deploy site → Run workflow, on main): a merge does not change the live site.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template, limited to the account and
# the pdf-to-einvoice.app zone) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a second start waits for the running one instead of racing it.
concurrency: deploy-site

jobs:
  deploy:
    if: github.repository == 'smart-byte/pdf-to-einvoice' # forks have no Cloudflare secrets
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pdf-to-einvoice.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.153.0 # a fixed release, older than two weeks when it was chosen
          workingDirectory: site
          command: deploy
